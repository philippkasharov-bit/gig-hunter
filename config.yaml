# Design-only gigs. Substring match, case-insensitive.
sources:
  kwork: true
  fl_ru: true
  freelance_ru: true
  avito: false      # anti-bot; needs browser/proxy, no adapter yet
  profi_ru: false   # login-gated; no adapter yet

# Source URLs, one per adapter. Verified from user's PC 2026-11-18.
feeds:
  fl_ru: https://www.fl.ru/rss/all.xml            # RSS
  freelance_ru: https://freelance.ru/task         # HTML task feed, all categories
  kwork: https://kwork.ru/projects?c=15           # c=15 = "Дизайн", all subcategories

# Category tag -> keywords (case-insensitive substrings). A gig must hit at
# least one keyword; its category is the specific one with most hits (title
# counts more), ties to the earlier one. The LAST category is generic: used only
# when no specific category hits (also for keyword-free Kwork gigs).
# Tags become Telegram hashtags: one word, letters/digits/underscore only.
categories:
  логотип:
    - логотип
    - фирменный стиль
    - брендбук
    - бренд бук
    - бренд-бук
  веб:
    - веб-дизайн
    - лендинг
    - landing
    - ui
    - ux
    - интерфейс
    - figma
    - фигма
  баннеры:
    - баннер
    - превью
    - обложк
  маркетплейс:
    - маркетплейс
    - карточки товар
    - карточка товар
    - карточку товар
    - карточек товар
    - карточки для товар
    - wildberries
    - вайлдберриз
    - ozon
    - озон
    - wb
    - вб
    - мп
  презентации:
    - презентаци
    - инфографик
  полиграфия:
    - упаковк
    - этикетк
    - наклейк
    - полиграф
    - афиш
    - буклет
    - листовк
  иллюстрация:
    - иллюстраци
    - маскот
    - москот   # common misspelling
  моушн:
    - моушн
    - motion
  дизайн:
    - дизайн
    - дизайнер
    - макет

# Feeds already limited to design (Kwork c=15): skip the keyword match.
# Stoplist, max_age_hours and min_budget_rub still apply.
keyword_free_sources:
  - kwork

# Tier hashtag -> minimum score (title keyword +10, description keyword +3,
# budget stated +2, posted <3h ago +3). Alert gets the highest tier reached.
score_tiers:
  топ: 20
  норм: 10
  слабо: 0

stoplist:
  - за идею
  - доля в проекте
  - процент от прибыли
  - бартер
  # Mass job ads (mostly Freelance.ru), let in by marketplace words
  - копирайт
  - без опыта
  - новичк
  - гибкий график
  - подработк
  - простая работа
  - заполнение товарн
  - из дома
  # Off-niche design (mostly Kwork). Phrases, not bare "3d"/"интерьер":
  # descriptions mention "3D-мокап" or "товар в интерьере" in in-niche gigs.
  - 3d-модел
  - 3d модел
  - 3d-печат
  - 3d принтер
  - roblox
  - revit
  - solidworks
  - архитектурн
  - дизайн интерьер
  - дизайнер интерьер
  - визуализация интерьер
  - визуализации интерьер
  - визуализаций интерьер

# null = no floor; user accepts low-paid gigs for reviews.
min_budget_rub: null
# Gigs older than this are skipped.
max_age_hours: 48
db_path: data/gighunter.db

poll_interval_s: 300     # 5 min between runs
max_alerts_per_run: 5    # rest stay unseen and go out next run
send_pause_s: 1.0        # Telegram: ~1 msg/s per chat
